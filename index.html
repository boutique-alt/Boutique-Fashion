<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/assets/logo.webp" />
    <link rel="apple-touch-icon" href="/images/assets/logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preload" as="image" href="/images/assets/hero-banner-1.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700&family=Roboto+Slab:wght@400;500;600;700&family=Lato:ital,wght@0,300;0,400;0,700&family=Whisper&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.boutiquefashion.shop/" />
    <meta property="og:url" content="https://www.boutiquefashion.shop/" />
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/'
        var url = 'https://www.boutiquefashion.shop' + (path === '/' ? '/' : path)
        var canonical = document.querySelector('link[rel="canonical"]')
        if (canonical) canonical.setAttribute('href', url)
        var ogUrl = document.querySelector('meta[property="og:url"]')
        if (ogUrl) ogUrl.setAttribute('content', url)
      })()
    </script>
    <title>Boutique Fashion – Where Comfort meets Confidence</title>
    <meta name="description" content="Discover premium boutique fashion, exclusive clothing, and accessories at Boutique Fashion. Shop our latest collections and find your perfect style." />
    <meta name="keywords" content="boutique fashion, dresses, kurta sets, bridal wear, exclusive clothing, premium fabrics, online boutique" />
    <meta property="og:title" content="Boutique Fashion – Where Comfort meets Confidence" />
    <meta property="og:description" content="Discover premium boutique fashion, exclusive clothing, and accessories at Boutique Fashion." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.boutiquefashion.shop/images/about/team-hero.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #f8f4f4;
      }
      #root {
        min-height: 100vh;
      }
      #app-boot {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #f8f4f4;
      }
      #app-boot__spinner {
        width: 2rem;
        height: 2rem;
        border-radius: 9999px;
        border: 2px solid rgba(136, 74, 77, 0.2);
        border-top-color: #884a4d;
        animation: app-boot-spin 0.7s linear infinite;
      }
      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }
      /* Keep SEO markup for crawlers; hide from first paint */
      #seo-content {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot" aria-busy="true" aria-label="Loading Boutique Fashion">
        <div id="app-boot__spinner" aria-hidden="true"></div>
      </div>

    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
